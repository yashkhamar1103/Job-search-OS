name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The ledger check compares against the base branch, so it needs more
          # than the default shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ledger CI (denied is terminal)
        run: |
          git fetch origin "${{ github.event.repository.default_branch }}" --depth=50 || true
          python -m app.cli.ledger_ci \
            --base "origin/${{ github.event.repository.default_branch }}"

      - name: Tests
        run: python -m pytest -q

      - name: Review file is current
        run: |
          python -m app.cli.confirmed_aliases
          if ! git diff --quiet -- review/; then
            echo "review/confirmed_aliases.md is stale." >&2
            echo "Run: python -m app.cli.confirmed_aliases" >&2
            git --no-pager diff -- review/ >&2
            exit 1
          fi
